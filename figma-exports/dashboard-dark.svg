<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 840" width="390" height="840">
  <defs>
    <linearGradient id="navBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0C0C0E" stop-opacity="0.7"/><stop offset="100%" stop-color="#0C0C0E" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="navBorder" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1C1C1E" stop-opacity="0.65"/><stop offset="100%" stop-color="#1C1C1E" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="30%" stop-color="#fff" stop-opacity="0.35"/><stop offset="70%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    
    <filter id="panelShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#30D158" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#30D158" flood-opacity="0.12"/>
    </filter>
    <filter id="btnShadowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#FF453A" flood-opacity="0.18"/>
    </filter>

    <!-- Dark blobs — неоновые -->
    <radialGradient id="blob1" cx="30%" cy="20%" r="50%"><stop offset="0%" stop-color="#0A84FF" stop-opacity="0.15"/><stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob2" cx="70%" cy="50%" r="45%"><stop offset="0%" stop-color="#5E5CE6" stop-opacity="0.12"/><stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob3" cx="20%" cy="70%" r="40%"><stop offset="0%" stop-color="#30D158" stop-opacity="0.10"/><stop offset="100%" stop-color="#30D158" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob4" cx="80%" cy="80%" r="50%"><stop offset="0%" stop-color="#FF9F0A" stop-opacity="0.12"/><stop offset="100%" stop-color="#FF9F0A" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob5" cx="50%" cy="30%" r="35%"><stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.08"/><stop offset="100%" stop-color="#BF5AF2" stop-opacity="0"/></radialGradient>

    <clipPath id="panelClip"><rect x="0" y="0" width="358" height="140" rx="20"/></clipPath>
    <clipPath id="btnClip"><rect x="0" y="0" width="179" height="100" rx="24"/></clipPath>
    <clipPath id="historyClip"><rect x="0" y="0" width="358" height="170" rx="20"/></clipPath>
  </defs>

  <!-- Фон -->
  <rect width="390" height="840" fill="#0C0C0E"/>
  <!-- Liquid blobs -->
  <rect width="390" height="840" fill="url(#blob1)"/>
  <rect width="390" height="840" fill="url(#blob2)"/>
  <rect width="390" height="840" fill="url(#blob3)"/>
  <rect width="390" height="840" fill="url(#blob4)"/>
  <rect width="390" height="840" fill="url(#blob5)"/>

  <!-- ========== NAV BAR ========== -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="390" height="56" fill="url(#navBg)"/>
    <line x1="0" y1="55.5" x2="390" y2="55.5" stroke="url(#navBorder)" stroke-width="0.5"/>
    
    <text x="16" y="34" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="590" fill="#98989D" letter-spacing="-0.01em">Главная</text>
    
    <!-- Online indicator -->
    <rect x="80" y="18" width="28" height="20" rx="10" fill="#30D158" fill-opacity="0.10" stroke="#30D158" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="88" y="31" font-size="8" fill="#30D158" font-weight="500">✓</text>
    
    <!-- User name -->
    <rect x="240" y="14" width="60" height="28" rx="10" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
    <text x="250" y="32" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#F2F2F7" font-weight="500">Ваня</text>
    
    <!-- Logout -->
    <rect x="304" y="14" width="32" height="28" rx="10" fill="#1C1C1E" fill-opacity="0.5" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
    <text x="316" y="31" font-size="10" fill="#FF453A" text-anchor="middle">↪</text>
    
    <!-- Theme toggle -->
    <rect x="340" y="14" width="32" height="28" rx="10" fill="#1C1C1E" fill-opacity="0.5" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
    <text x="356" y="31" font-size="12" fill="#FF9F0A" text-anchor="middle">🌙</text>
  </g>

  <!-- ========== TIMER PANEL ========== -->
  <g transform="translate(16, 72)">
    <rect x="0" y="0" width="358" height="130" rx="20" fill="url(#panelBg)" stroke="#fff" stroke-opacity="0.1" stroke-width="0.5" filter="url(#panelShadow)"/>
    <rect x="0" y="0" width="358" height="130" rx="20" fill="url(#panelGlow)" clip-path="url(#panelClip)"/>
    
    <text x="132" y="32" font-size="16" fill="#0A84FF">🕐</text>
    <text x="152" y="32" font-size="12" font-weight="600" fill="#F2F2F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" opacity="0.8">Остаток на сегодня</text>
    
    <text x="179" y="78" font-size="42" font-weight="700" fill="#F2F2F7" font-family="'SF Mono','SF Pro Display',monospace" text-anchor="middle" letter-spacing="-0.02em">0:00:00</text>
    
    <g transform="translate(270, 8)">
      <rect x="0" y="0" width="32" height="28" rx="14" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
      <text x="16" y="17" font-size="10" fill="#98989D" text-anchor="middle" font-weight="500">↻</text>
    </g>
    <g transform="translate(310, 8)">
