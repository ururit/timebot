      <text x="18" y="23" font-size="20" font-weight="700" fill="#30D158" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- ========== ACTION BUTTONS ========== -->
  <g transform="translate(16, 346)">
    <!-- Зеленая кнопка — активна -->
    <rect x="0" y="0" width="172" height="90" rx="24" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-opacity="0.25" stroke-width="0.5" filter="url(#btnShadow)"/>
    <text x="86" y="48" font-size="18" font-weight="600" fill="#30D158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Я пришёл</text>
    <ellipse cx="120" cy="45" rx="80" ry="30" fill="#30D158" fill-opacity="0.06"/>
    
    <!-- Красная кнопка — неактивна -->
    <rect x="186" y="0" width="172" height="90" rx="24" fill="#FF453A" fill-opacity="0.12" stroke="#FF453A" stroke-opacity="0.25" stroke-width="0.5" opacity="0.25"/>
    <text x="272" y="48" font-size="18" font-weight="600" fill="#FF453A" text-anchor="middle" opacity="0.25" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Я ушёл</text>
  </g>

