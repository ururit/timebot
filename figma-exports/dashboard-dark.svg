    <rect x="0" y="0" width="358" height="120" rx="20" fill="url(#panelGlow)" clip-path="url(#panelClip)"/>
    
    <text x="148" y="28" font-size="16" fill="#FF453A">📉</text>
    <text x="168" y="28" font-size="12" font-weight="600" fill="#F2F2F7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" opacity="0.8">Баланс за месяц</text>
    
    <g transform="translate(48, 42)">
