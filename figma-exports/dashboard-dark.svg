    <text x="179" y="72" font-size="44" font-weight="700" fill="#FF453A" text-anchor="middle" letter-spacing="-0.02em" font-family="'SF Mono','SF Pro Display',monospace">−1ч 15м</text>
    
    <g transform="translate(274, 42)">
